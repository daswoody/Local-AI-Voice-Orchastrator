[project]
name = "heimai-tts-xtts"
version = "0.1.0"
description = "XTTS-v2-TTS-Service (Hauptstimme, Streaming) fuer das Heim-AI-Projekt (Mikro-Phase 1.10)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
# coqui-tts ist der gepflegte Fork (idiap) der eingestellten Coqui-TTS-Lib -
# das Original unterstuetzt kein Python 3.11+. Zieht torch (~2 GB Image).
engine = [
    "coqui-tts>=0.24",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_xtts"]
