[project]
name = "heimai-stt"
version = "0.1.0"
description = "STT-Service (faster-whisper) fuer das Heim-AI-Projekt (Mikro-Phase 1.8)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=1.26",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
# Die eigentliche Whisper-Engine ist ein Extra: Tests laufen ohne sie
# (Engine wird gemockt), nur das Docker-Image installiert sie.
engine = [
    "faster-whisper>=1.0",
]
# GPU-Support ohne CUDA-Basis-Image: ctranslate2 findet cuBLAS/cuDNN aus den
# pip-Paketen, wenn LD_LIBRARY_PATH auf deren lib-Verzeichnisse zeigt
# (siehe Dockerfile). Dokumentierter Weg aus dem faster-whisper-README.
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt_service"]
