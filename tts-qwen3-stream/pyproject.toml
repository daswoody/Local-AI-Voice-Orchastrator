[project]
name = "heimai-tts-qwen3-stream"
version = "0.1.0"
description = "Qwen3-TTS mit echtem Streaming als Heim-AI-Sprachausgabe nach dem Engine-Vertrag v1 (v1.22)"
requires-python = ">=3.11"
dependencies = [
    "tts-engine-kit",
    "huggingface_hub>=1.5,<2",
    "numpy>=1.26",
]

[project.optional-dependencies]
engine = [
    # Zieht den qwen-tts-Fork (qwen-tts-hf, Modul `qwen_tts`) und neuere
    # transformers mit - deshalb nie zusammen mit `qwen-tts`.
    "faster-qwen3-tts==0.5.4",
    # Dieselbe torch-Version wie tts-xtts - laeuft nachweislich
    # mit dem Treiber der VM. Das neueste Wheel kann einen neueren Treiber
    # verlangen.
    "torch==2.12.1",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv.sources]
tts-engine-kit = { path = "../tts-engine-kit" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_qwen3_stream"]
