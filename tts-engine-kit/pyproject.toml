[project]
name = "tts-engine-kit"
version = "0.1.0"
description = "Gemeinsamer TTS-Engine-Vertrag fuer Heim-AI (v1.20): HTTP-API, Laden/Entladen, Modell im Unterprozess"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Multipart-Formulare (Voice-Sample im Synthese-Request)
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    # nur fuer die Audio-Helfer (float -> PCM16); der Kern kommt ohne aus
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_engine_kit"]
