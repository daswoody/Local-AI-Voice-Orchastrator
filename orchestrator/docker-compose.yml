services:
  orchestrator:
    build:
      # Relativ zum Repo-Root, nicht zu dieser Datei: Coolify fuehrt
      # "docker compose ... --project-directory <repo-root>" aus, auch wenn
      # die Compose-Datei selbst in orchestrator/ liegt. Lokales
      # `docker compose up` aus orchestrator/ heraus funktioniert damit
      # NICHT - dafuer bewusst `docker build`/`docker run` in der README.
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: heimai-orchestrator
    restart: unless-stopped
    env_file:
      # Optional: existiert im Coolify-Checkout nicht (.env ist gitignored),
      # Coolify injiziert die in seiner UI gesetzten Variablen selbst.
      # Fuer lokales `docker compose up` aus dem Repo-Root wird sie genutzt,
      # falls vorhanden.
      - path: ./orchestrator/.env
        required: false
    ports:
      - "8000:8000"
    networks:
      - ai-lab

networks:
  ai-lab:
    external: true
    # Name muss zum bestehenden Docker-Netzwerk von LiteLLM/Weaviate passen
    # (siehe Sektion 4.6 der Spezifikation) - in Coolify unter dem jeweiligen
    # Server/Projekt pruefen, notfalls per `docker network ls` auf der AI-VM.
