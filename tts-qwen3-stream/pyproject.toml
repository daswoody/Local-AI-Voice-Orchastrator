[project]
name = "heimai-tts-qwen3-stream"
version = "0.2.0"
description = "Qwen3-TTS mit Streaming und GGUF-Quantisierung als Heim-AI-Sprachausgabe nach dem Engine-Vertrag v1 (v1.25)"
requires-python = ">=3.11"
dependencies = [
    "tts-engine-kit",
    "huggingface_hub>=0.34",
    "numpy>=1.26",
]

[project.optional-dependencies]
engine = [
    # qwentts.cpp (ggml) mit Streaming. Das Linux-Wheel (CUDA 12.8) enthaelt
    # fuer Turing (sm_75) nur PTX: Der Treiber uebersetzt beim ersten Mal (JIT).
    # Es bringt libcudart/libcublas nicht mit - die liefert das Image.
    "qwentts-cpp-python==0.5.0",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv.sources]
tts-engine-kit = { path = "../tts-engine-kit" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_qwen3_stream"]
