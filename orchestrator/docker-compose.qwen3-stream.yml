# Qwen3-TTS mit echtem Streaming (v1.24) - Engine nach dem Engine-Vertrag
# (tts-engine-kit) auf Basis von faster-qwen3-tts, als EIGENER Coolify-Deploy.
# Gebraucht, weil audio.cpp Qwen3-TTS nur offline (Satz fuer Satz) kann.
# Base Directory `/`, Docker Compose Location
# `/orchestrator/docker-compose.qwen3-stream.yml` (Coolify nimmt das Base
# Directory als --project-directory, der Build-Context ist das Repo-Root).
# Im Panel (Sprachausgabe -> Engines nach dem Engine-Vertrag) eintragen:
# ID `qwen3-stream`, Adresse http://tts-qwen3-stream:8000. Laden/Entladen und
# Karte steuert das Panel (GPUs).
#
# Lokal vom Repo-Root aus:
#   docker compose -f orchestrator/docker-compose.qwen3-stream.yml --project-directory . up

services:
  tts-qwen3-stream:
    build:
      context: .
      dockerfile: tts-qwen3-stream/Dockerfile
    container_name: heimai-tts-qwen3-stream
    restart: unless-stopped
    environment:
      # Karte beim Start; zur Laufzeit weist das Admin-Panel (GPUs) eine
      # andere zu oder schaltet aus. Nur Nvidia-Karten (kein "cpu").
      ENGINE_DEVICE: ${QWEN3_STREAM_DEVICE:-cuda:0}
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      # Modell schon beim Start laden? Default nein: laedt beim Aktivieren im
      # Panel bzw. beim ersten Probehoeren.
      ENGINE_PRELOAD: ${QWEN3_STREAM_PRELOAD:-false}
      # 0.6B (~3,5 GB VRAM) ist der Streaming-Default; 1.7B klingt besser
      # (~6,5 GB): Qwen/Qwen3-TTS-12Hz-1.7B-Base. Download beim ersten Start.
      QWEN3_MODEL: ${QWEN3_STREAM_MODEL:-Qwen/Qwen3-TTS-12Hz-0.6B-Base}
      # auto = bfloat16 ab Ampere, float16 auf Turing (2080 Ti); float32,
      # falls das Audio kaputt klingt (doppeltes VRAM).
      QWEN3_DTYPE: ${QWEN3_STREAM_DTYPE:-auto}
      # Codec-Schritte je Chunk (1 Schritt = 1/12 s Audio): 4 = frueher, aber
      # die Karte muss deutlich schneller als Echtzeit sein; 12 = ruhiger.
      QWEN3_CHUNK_STEPS: ${QWEN3_STREAM_CHUNK_STEPS:-8}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - qwen3-stream-models:/models
    networks:
      - ai-lab
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  ai-lab:
    external: true

volumes:
  qwen3-stream-models:
