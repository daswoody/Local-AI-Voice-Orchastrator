# Voice-Stack: Orchestrator + STT + beide TTS-Engines als EIN Coolify-Deploy.
# Alle build-contexts sind relativ zum Repo-Root. Coolify nimmt das Base
# Directory als --project-directory, deshalb in Coolify: Base Directory `/`,
# Docker Compose Location `/orchestrator/docker-compose.yml`. Lokales
# `docker compose up` entsprechend vom Repo-Root aus:
#   docker compose -f orchestrator/docker-compose.yml --project-directory . up

services:
  orchestrator:
    build:
      # Repo-Root als Context: das Image baut auch die User-Web-UI aus
      # frontend/ mit (Multi-Stage, siehe orchestrator/Dockerfile).
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: heimai-orchestrator
    restart: unless-stopped
    env_file:
      # Optional: existiert im Coolify-Checkout nicht (.env ist gitignored),
      # Coolify injiziert die in seiner UI gesetzten Variablen selbst.
      - path: ./orchestrator/.env
        required: false
    # Bewusst KEIN direkt veroeffentlichter Port mehr: Zugriff laeuft
    # ausschliesslich ueber Coolify/Traefik (HTTPS-Domain). Der alte
    # Klartext-Zugang http://<IP>:8000 war der Grund fuer "Nicht sicher"-
    # Warnungen und haette Login-Tokens unverschluesselt durchs LAN
    # geschickt. Fuer Debugging voruebergehend wieder einkommentieren:
    # ports:
    #   - "8000:8000"
    volumes:
      # SQLite (User/Trigger/Filler/Karten) + vorgenerierte Filler-Audios
      - orchestrator-data:/data
      # Dasselbe Volume, das XTTS liest: Sample-Uploads aus dem Admin-Panel
      # landen direkt dort, wo das Voice-Cloning sie erwartet.
      - xtts-voices:/voices
    networks:
      - ai-lab
    depends_on:
      - stt
      - tts-piper
      - tts-xtts
    deploy:
      resources:
        reservations:
          devices:
            # NUR lesender Zugriff fuer die GPU-Uebersicht im Admin-Panel
            # (4.2/v1.14): "utility" gibt NVML/nvidia-smi, aber KEINE
            # CUDA-Laufzeit - der Orchestrator rechnet nichts auf der GPU
            # und belegt kein VRAM. Damit sieht das Panel die Belegung
            # beider Karten inklusive LM Studio auf dem Host.
            # Falls der Runtime die Capability nicht akzeptiert: auf
            # [gpu] aendern (dann ist auch die CUDA-Runtime sichtbar) -
            # ohne den Block laeuft alles weiter, nur ohne VRAM-Zahlen.
            - driver: nvidia
              count: all
              capabilities: [utility]

  stt:
    build:
      context: ./stt-service
      dockerfile: Dockerfile
    container_name: heimai-stt
    restart: unless-stopped
    environment:
      # Fuer den ersten Test ohne nvidia-container-toolkit: WHISPER_DEVICE=cpu
      # und WHISPER_COMPUTE_TYPE=int8 setzen (und den deploy-Block unten
      # entfernen) - Medium auf CPU ist langsam, small/base sind fluessiger.
      WHISPER_MODEL: medium
      # Start-Default; die tatsaechliche Karte weist das Admin-Panel zur
      # Laufzeit zu ("cuda:0"/"cuda:1"/"cpu", v1.14) und stellt sie nach
      # einem Neustart automatisch wieder her.
      WHISPER_DEVICE: cuda:0
      WHISPER_COMPUTE_TYPE: float16
      # Damit "cuda:1" im Panel dieselbe Karte meint wie Index 1 in
      # nvidia-smi: CUDA sortiert sonst nach "schnellste zuerst".
      CUDA_DEVICE_ORDER: PCI_BUS_ID
    volumes:
      - whisper-models:/models
    networks:
      - ai-lab
    deploy:
      resources:
        reservations:
          devices:
            # ALLE Karten sichtbar machen (v1.14): Welche genutzt wird,
            # entscheidet der Dienst selbst - nur so ist die Zuweisung im
            # Panel umschaltbar, ohne den Container neu zu erstellen.
            - driver: nvidia
              count: all
              capabilities: [gpu]

  tts-piper:
    build:
      context: ./tts-piper
      dockerfile: Dockerfile
    container_name: heimai-tts-piper
    restart: unless-stopped
    # Bewusst CPU: Piper ist auch ohne GPU sub-sekundenschnell (4.3) und
    # das VRAM-Budget (4.2) ist fuer LLM/Whisper/XTTS reserviert.
    volumes:
      - piper-models:/models
    networks:
      - ai-lab

  tts-xtts:
    build:
      context: ./tts-xtts
      dockerfile: Dockerfile
    container_name: heimai-tts-xtts
    restart: unless-stopped
    environment:
      # Start-Default; die Karte weist das Admin-Panel zur Laufzeit zu (v1.14).
      DEVICE: cuda:0
      CUDA_DEVICE_ORDER: PCI_BUS_ID
    volumes:
      - xtts-models:/models
      # Deutsche Sample-WAVs ({voice_id}.wav) hier ablegen - offener Punkt
      # der Spezifikation ("Konkrete Voice-Samples fuer XTTS-v2 erstellen").
      - xtts-voices:/voices
    networks:
      - ai-lab
    deploy:
      resources:
        reservations:
          devices:
            # Alle Karten sichtbar (v1.14), Auswahl trifft der Dienst.
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  ai-lab:
    external: true
    # Name muss zum bestehenden Docker-Netzwerk von LiteLLM/Weaviate passen
    # (siehe Sektion 4.6 der Spezifikation) - in Coolify unter dem jeweiligen
    # Server/Projekt pruefen, notfalls per `docker network ls` auf der AI-VM.

volumes:
  orchestrator-data:
  whisper-models:
  piper-models:
  xtts-models:
  xtts-voices:
