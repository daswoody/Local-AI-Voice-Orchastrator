[project]
name = "heimai-tts-piper"
version = "0.1.0"
description = "Piper-TTS-Service (Filler-Engine) fuer das Heim-AI-Projekt (Mikro-Phase 1.9)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
# piper-tts liefert das `piper`-CLI (Konsolen-Skript), das die Engine per
# subprocess aufruft. Als Extra, damit Tests ohne onnxruntime laufen.
engine = [
    "piper-tts>=1.2",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_piper"]
